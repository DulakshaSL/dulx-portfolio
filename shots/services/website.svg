<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111e"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b101c"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad3)"/>

  <!-- Desktop Browser Mockup Frame -->
  <g transform="translate(100, 40)">
    <rect width="600" height="420" rx="16" fill="url(#browserGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Browser Chrome Header -->
    <rect width="600" height="42" rx="16" fill="#0d1424"/>
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981" opacity="0.8"/>

    <!-- URL Bar -->
    <rect x="90" y="8" width="420" height="26" rx="13" fill="#161f36" stroke="#334155" stroke-width="1"/>
    <text x="120" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://your-brand-website.com</text>
    <circle cx="106" cy="21" r="3" fill="#10b981"/>

    <!-- Webpage Content -->
    <!-- Nav Mock -->
    <rect x="30" y="60" width="80" height="14" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="380" y="62" width="40" height="10" rx="3" fill="#94a3b8" opacity="0.7"/>
    <rect x="435" y="62" width="40" height="10" rx="3" fill="#94a3b8" opacity="0.7"/>
    <rect x="490" y="56" width="75" height="22" rx="6" fill="#4f46e5"/>
    <text x="506" y="71" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Get Started</text>

    <!-- Hero Section -->
    <!-- Hero Headline -->
    <rect x="30" y="105" width="280" height="24" rx="6" fill="#ffffff"/>
    <rect x="30" y="138" width="220" height="14" rx="4" fill="url(#heroGradient)"/>
    <rect x="30" y="165" width="260" height="8" rx="3" fill="#64748b" opacity="0.6"/>
    <rect x="30" y="178" width="200" height="8" rx="3" fill="#64748b" opacity="0.6"/>

    <!-- Hero Buttons -->
    <rect x="30" y="200" width="100" height="32" rx="8" fill="url(#heroGradient)"/>
    <rect x="140" y="200" width="90" height="32" rx="8" fill="#141c2e" stroke="#334155" stroke-width="1"/>

    <!-- Graphic / Hero Visual on Right Side of Website -->
    <rect x="330" y="105" width="235" height="140" rx="12" fill="#0d1424" stroke="#334155" stroke-width="1"/>
    <!-- Mock Dashboard Cards inside Website -->
    <rect x="345" y="120" width="205" height="45" rx="8" fill="#162035"/>
    <circle cx="365" cy="142" r="10" fill="#6366f1"/>
    <rect x="385" y="135" width="80" height="6" rx="2" fill="#ffffff"/>
    <rect x="385" y="146" width="50" height="5" rx="2" fill="#64748b"/>

    <rect x="345" y="175" width="98" height="55" rx="8" fill="#162035"/>
    <text x="357" y="196" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">99.8%</text>
    <text x="357" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Uptime SLA</text>

    <rect x="452" y="175" width="98" height="55" rx="8" fill="#162035"/>
    <text x="464" y="196" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">100 / 100</text>
    <text x="464" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Lighthouse Performance</text>

    <!-- 3 Feature Columns Below Hero -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="165" height="100" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="24" r="12" fill="#6366f1" fill-opacity="0.2"/>
      <rect x="16" y="50" width="100" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
      <rect x="16" y="68" width="130" height="6" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="16" y="78" width="90" height="6" rx="2" fill="#64748b" opacity="0.6"/>

      <rect x="185" y="0" width="165" height="100" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <circle cx="209" cy="24" r="12" fill="#06b6d4" fill-opacity="0.2"/>
      <rect x="201" y="50" width="100" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
      <rect x="201" y="68" width="130" height="6" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="201" y="78" width="90" height="6" rx="2" fill="#64748b" opacity="0.6"/>

      <rect x="370" y="0" width="165" height="100" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <circle cx="394" cy="24" r="12" fill="#a855f7" fill-opacity="0.2"/>
      <rect x="386" y="50" width="100" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
      <rect x="386" y="68" width="130" height="6" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="386" y="78" width="90" height="6" rx="2" fill="#64748b" opacity="0.6"/>
    </g>

    <!-- Floating Mobile Responsive Pill -->
    <g transform="translate(460, 310)">
      <rect width="115" height="38" rx="8" fill="#18233a" stroke="#4f46e5" stroke-width="1.5"/>
      <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">📱 Responsive</text>
    </g>
  </g>
</svg>