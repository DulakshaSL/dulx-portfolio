<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111e"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="editorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e33"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad2)"/>

  <!-- Code Editor & Tech Doc Workspace -->
  <g transform="translate(100, 45)">
    <!-- Main IDE Window -->
    <rect width="600" height="410" rx="14" fill="url(#editorGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <rect width="600" height="38" rx="14" fill="#0d1424"/>
    <circle cx="24" cy="19" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="44" cy="19" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="64" cy="19" r="6" fill="#10b981" opacity="0.8"/>

    <!-- Document Tabs -->
    <rect x="100" y="6" width="150" height="32" rx="8" fill="#161e33" stroke="#334155" stroke-width="1"/>
    <text x="120" y="26" fill="#e2e8f0" font-family="monospace" font-size="11">api-architecture.md</text>

    <rect x="258" y="8" width="130" height="28" rx="6" fill="#0d1424"/>
    <text x="272" y="26" fill="#64748b" font-family="monospace" font-size="11">endpoints.json</text>

    <!-- Editor Body: Split into Markdown on Left, Preview on Right -->
    <!-- Divider -->
    <line x1="300" y1="38" x2="300" y2="410" stroke="#1e293b" stroke-width="1.5"/>

    <!-- LEFT: Markdown Source -->
    <text x="25" y="70" fill="#a855f7" font-family="monospace" font-size="13" font-weight="bold"># Authentication Flow</text>
    <text x="25" y="95" fill="#94a3b8" font-family="monospace" font-size="11">Integrate JWT Bearer tokens securely:</text>
    
    <!-- Code snippet block -->
    <rect x="20" y="115" width="260" height="110" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="140" fill="#38bdf8" font-family="monospace" font-size="10">POST /api/v1/auth/session</text>
    <text x="35" y="160" fill="#64748b" font-family="monospace" font-size="10">Content-Type: application/json</text>
    <text x="35" y="185" fill="#a5b4fc" font-family="monospace" font-size="10">{ "apiKey": "live_sec_99..." }</text>
    <text x="35" y="205" fill="#34d399" font-family="monospace" font-size="10">// → 200 OK: session_token</text>

    <text x="25" y="255" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold">### Error Handling Matrix</text>
    <rect x="25" y="270" width="250" height="8" rx="2" fill="#475569" opacity="0.6"/>
    <rect x="25" y="285" width="220" height="8" rx="2" fill="#475569" opacity="0.6"/>
    <rect x="25" y="300" width="240" height="8" rx="2" fill="#475569" opacity="0.6"/>

    <!-- RIGHT: Rendered Tech Guide Preview -->
    <g transform="translate(320, 55)">
      <!-- Rendered Article Badge -->
      <rect x="0" y="10" width="90" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3"/>
      <text x="8" y="24" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">DOCS • v2.4</text>

      <text x="0" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Production API Reference</text>
      <text x="0" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Standardized payload design and webhook contracts.</text>

      <!-- Parameter Table Mock -->
      <rect x="0" y="100" width="250" height="80" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="125" x2="250" y2="125" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Parameter</text>
      <text x="100" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Type</text>
      <text x="170" y="117" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Required</text>
      
      <text x="12" y="145" fill="#38bdf8" font-family="monospace" font-size="10">client_id</text>
      <text x="100" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">string</text>
      <text x="170" y="145" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">Yes</text>

      <text x="12" y="168" fill="#38bdf8" font-family="monospace" font-size="10">timeout_ms</text>
      <text x="100" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">integer</text>
      <text x="170" y="168" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Optional</text>

      <!-- Swagger Pill / Verified Badge -->
      <g transform="translate(0, 200)">
        <rect width="250" height="50" rx="8" fill="#131c30" stroke="#334155" stroke-width="1"/>
        <circle cx="25" cy="25" r="12" fill="#a855f7" fill-opacity="0.2"/>
        <text x="19" y="30" fill="#c084fc" font-family="monospace" font-size="14">✓</text>
        <text x="48" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">OpenAPI 3.1 Spec Ready</text>
        <text x="48" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Interactive Postman &amp; Swagger Export</text>
      </g>
    </g>
  </g>
</svg>