<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111e"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="saasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b101c"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad4)"/>

  <!-- Web App SaaS Dashboard Workspace -->
  <g transform="translate(90, 40)">
    <!-- Main Shell -->
    <rect width="620" height="420" rx="16" fill="url(#saasGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Left Sidebar Nav -->
    <rect width="130" height="420" rx="16" fill="#0d1424"/>
    <rect x="129" y="0" width="1" height="420" fill="#1e293b"/>

    <!-- Logo / Brand in App -->
    <circle cx="35" cy="30" r="12" fill="#4f46e5"/>
    <rect x="55" y="24" width="55" height="12" rx="3" fill="#ffffff"/>

    <!-- Sidebar Menu Items -->
    <rect x="15" y="65" width="100" height="26" rx="6" fill="#1e293b"/>
    <text x="38" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Overview</text>
    <circle cx="26" cy="78" r="4" fill="#38bdf8"/>

    <text x="38" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Analytics</text>
    <text x="38" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Database</text>
    <text x="38" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">API Gateway</text>
    <text x="38" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Auth &amp; Users</text>

    <!-- Sidebar Database Health Badge -->
    <rect x="15" y="340" width="100" height="55" rx="8" fill="#131c30" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="358" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">● PostgreSQL 16</text>
    <text x="24" y="372" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Replica: Synchronized</text>
    <text x="24" y="385" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Latency: 4.2ms</text>

    <!-- Dashboard Content Header -->
    <rect x="150" y="22" width="140" height="14" rx="4" fill="#ffffff"/>
    <rect x="150" y="42" width="220" height="8" rx="2" fill="#64748b" opacity="0.6"/>

    <!-- Status Badges Top Right -->
    <rect x="470" y="18" width="125" height="28" rx="8" fill="#131c30" stroke="#334155" stroke-width="1"/>
    <circle cx="484" cy="32" r="4" fill="#10b981"/>
    <text x="495" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">APIs Live: 99.99%</text>

    <!-- 3 Stat KPI Cards -->
    <g transform="translate(150, 68)">
      <rect x="0" y="0" width="140" height="70" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Active API Requests</text>
      <text x="14" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">1.48M / mo</text>
      <text x="14" y="62" fill="#34d399" font-family="system-ui, sans-serif" font-size="8">▲ 24.5% vs last month</text>

      <rect x="155" y="0" width="140" height="70" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <text x="169" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Database Throughput</text>
      <text x="169" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">12.8k QPS</text>
      <text x="169" y="62" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8">Optimized Indexing</text>

      <rect x="310" y="0" width="140" height="70" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <text x="324" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ML Processing Queue</text>
      <text x="324" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">0.12s avg</text>
      <text x="324" y="62" fill="#c084fc" font-family="system-ui, sans-serif" font-size="8">Real-time Inference</text>
    </g>

    <!-- Main Chart Section -->
    <g transform="translate(150, 155)">
      <rect width="450" height="150" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Real-Time Traffic &amp; Backend Execution</text>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="50" x2="430" y2="50" stroke="#1e293b" stroke-width="1"/>
      <line x1="20" y1="85" x2="430" y2="85" stroke="#1e293b" stroke-width="1"/>
      <line x1="20" y1="120" x2="430" y2="120" stroke="#1e293b" stroke-width="1"/>

      <!-- Smooth Area Curve -->
      <path d="M20 120 Q 80 80, 140 95 T 260 55 T 350 40 T 430 30 L 430 135 L 20 135 Z" fill="url(#chartGrad)"/>
      <path d="M20 120 Q 80 80, 140 95 T 260 55 T 350 40 T 430 30" fill="none" stroke="#6366f1" stroke-width="2.5"/>

      <!-- Secondary Curve (Cyan) -->
      <path d="M20 130 Q 90 110, 150 115 T 270 85 T 360 70 T 430 55" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3 3"/>
    </g>

    <!-- Bottom Architecture Nodes Pill -->
    <g transform="translate(150, 320)">
      <rect width="450" height="75" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CONNECTED ARCHITECTURE STACK</text>
      
      <!-- Tech Nodes -->
      <rect x="18" y="36" width="90" height="26" rx="6" fill="#161f36" stroke="#334155" stroke-width="1"/>
      <text x="32" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">React 19 UI</text>

      <text x="116" y="52" fill="#64748b" font-family="monospace">→</text>

      <rect x="135" y="36" width="95" height="26" rx="6" fill="#161f36" stroke="#334155" stroke-width="1"/>
      <text x="146" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Node / Express</text>

      <text x="238" y="52" fill="#64748b" font-family="monospace">→</text>

      <rect x="255" y="36" width="90" height="26" rx="6" fill="#161f36" stroke="#334155" stroke-width="1"/>
      <text x="272" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">PostgreSQL</text>

      <text x="353" y="52" fill="#64748b" font-family="monospace">→</text>

      <rect x="370" y="36" width="65" height="26" rx="6" fill="#161f36" stroke="#334155" stroke-width="1"/>
      <text x="382" y="53" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">AI / ML</text>
    </g>
  </g>
</svg>